<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="CarView Pakistan. Create a car ad, add real photos and a 360 walk-around, and preview the complete listing. Works offline without installation.">
  <title>CarView Pakistan · Your car, the complete picture</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2318796b'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='38' fill='white' font-family='Arial'%3EC%3C/text%3E%3C/svg%3E">
  <style>:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #1a3039;
  background: #f6f8f4;
  --ink: #1a3039;
  --muted: #728079;
  --green: #18796b;
  --dark: #105b51;
  --line: #e0e7de;
  --mint: #eaf2eb;
  --paper: #fff;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  color: inherit;
  border: 0;
  background: none;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible {
  outline: 3px solid #8fc9b3;
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
a {
  color: var(--green);
  text-decoration: none;
}
img {
  display: block;
  max-width: 100%;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  letter-spacing: -0.7px;
}
p {
  line-height: 1.8;
}
.shell {
  max-width: 1260px;
  margin: auto;
  padding: 0 36px;
}
.site-header {
  background: white;
  border-bottom: 1px solid var(--line);
}
.header-inner {
  min-height: 88px;
  display: flex;
  gap: 34px;
  align-items: center;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
  padding: 0;
}
.brand-icon {
  background: var(--green);
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 30px;
  line-height: 1;
  transform: rotate(-4deg);
}
.brand b {
  font-size: 27px;
  letter-spacing: -1.6px;
}
.brand small {
  display: block;
  font-size: 7px;
  letter-spacing: 5px;
  margin: 5px 0 0 2px;
}
.header-inner nav {
  display: flex;
  align-self: stretch;
  gap: 27px;
  margin-left: 22px;
}
.header-inner nav button {
  font-size: 12px;
  border-bottom: 3px solid transparent;
  padding: 3px 0 0;
}
.header-inner nav button.active {
  color: var(--green);
  border-color: var(--green);
  font-weight: 700;
}
.local-pill {
  font-size: 10px;
  color: var(--green);
  background: var(--mint);
  border-radius: 30px;
  padding: 8px 11px;
  margin-left: auto;
  white-space: nowrap;
}
.btn {
  display: inline-flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  border: 1px solid var(--line);
  background: white;
  border-radius: 7px;
  padding: 11px 16px;
  min-height: 42px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  line-height: 1.3;
}
.btn:hover {
  background: #f0f5ed;
}
.btn.primary {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.btn.primary:hover {
  background: var(--dark);
}
.btn.small {
  font-size: 11px;
  min-height: 33px;
  padding: 8px 11px;
}
.btn.danger {
  color: #9b4334;
}
.text-btn {
  color: var(--green);
  font-size: 12px;
  padding: 4px 0;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 1.6px;
  font-weight: 700;
  color: var(--green);
}
.muted {
  color: var(--muted);
}
.page-heading {
  display: flex;
  align-items: flex-end;
  gap: 24px;
  padding: 35px 0 25px;
}
.page-heading h1 {
  font-size: 32px;
  margin: 8px 0 10px;
  line-height: 1.25;
}
.page-heading p {
  font-size: 12px;
  color: var(--muted);
}
.heading-actions {
  margin-left: auto;
  display: flex;
  gap: 9px;
  align-items: center;
  flex-shrink: 0;
}
.hero {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  align-items: center;
  gap: 20px;
  padding: 43px 0 30px;
}
.hero h1 {
  font-size: 43px;
  line-height: 1.18;
  letter-spacing: -1.6px;
  margin: 12px 0 17px;
  max-width: 630px;
}
.hero p {
  font-size: 13px;
  color: var(--muted);
  max-width: 510px;
}
.hero-art {
  background: linear-gradient(145deg, #eaf2e7, #f3f6ee);
  border: 1px solid #e1e9dc;
  border-radius: 16px;
  padding: 32px;
  position: relative;
  min-height: 235px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.hero-art svg {
  width: 250px;
  max-width: 95%;
  height: auto;
  fill: none;
  stroke: #819d8e;
  stroke-width: 1.1;
}
.hero-art .hero-badge {
  position: absolute;
  right: 24px;
  top: 24px;
  background: white;
  border: 1px solid #dce7d8;
  padding: 9px 12px;
  border-radius: 20px;
  font-size: 10px;
  color: var(--green);
  font-weight: 700;
}
.hero-art p {
  font-size: 11px;
  margin-top: 17px;
}
.search-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 24px;
}
.search-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
  gap: 12px;
  align-items: end;
}
.search-more {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  padding-top: 15px;
  margin-top: 15px;
  border-top: 1px solid var(--line);
}
.search-footer {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 13px;
  font-size: 11px;
  color: var(--muted);
}
.search-footer .text-btn {
  font-size: 11px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}
.field label,
.field > span {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  min-width: 0;
  min-height: 43px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 11px;
  background: #fcfdfb;
  color: var(--ink);
  font-size: 12px;
}
.field textarea {
  min-height: 128px;
  line-height: 1.7;
  resize: vertical;
}
.field small,
.help {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.7;
  font-weight: 400;
}
.field.error input,
.field.error select,
.field.error textarea {
  border-color: #c16d55;
  background: #fffaf7;
}
.field .error-text {
  color: #a14532;
}
.required {
  color: #a1513a;
}
.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 17px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px 20px;
}
.span-2 {
  grid-column: 1/-1;
}
.form-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  padding: 26px;
}
.form-card + .form-card {
  margin-top: 18px;
}
.section-title {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 23px;
}
.section-number {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--mint);
  color: var(--green);
  font-size: 12px;
  border-radius: 9px;
  font-weight: 700;
}
.section-title h2 {
  font-size: 19px;
  margin-bottom: 5px;
}
.section-title p {
  font-size: 11px;
  color: var(--muted);
}
.wizard-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 268px;
  gap: 23px;
  align-items: start;
}
.wizard-main {
  min-width: 0;
}
.wizard-aside {
  background: #eaf2e8;
  border: 1px solid #dbe7d8;
  border-radius: 10px;
  padding: 22px;
  position: sticky;
  top: 20px;
}
.wizard-aside .step-count {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--green);
  margin-bottom: 13px;
}
.wizard-aside h2 {
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 10px;
}
.wizard-aside p {
  font-size: 11px;
  color: #63796b;
}
.aside-rule {
  border: 0;
  border-top: 1px solid #d4e3d1;
  margin: 19px 0;
}
.aside-summary {
  display: grid;
  grid-template-columns: 75px 1fr;
  font-size: 11px;
  line-height: 1.8;
  gap: 8px;
}
.aside-summary dt {
  color: var(--muted);
}
.aside-summary dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.stepper {
  display: flex;
  margin: 0 0 23px;
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  background: white;
}
.stepper button {
  flex: 1;
  padding: 15px 9px;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  border-right: 1px solid var(--line);
}
.stepper button:last-child {
  border: 0;
}
.stepper button b {
  border: 1px solid #d8e0d4;
  border-radius: 50%;
  font-size: 10px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  font-weight: 600;
  flex-shrink: 0;
}
.stepper button.active {
  background: var(--mint);
  color: var(--green);
  font-weight: 700;
}
.stepper button.active b {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.stepper button.done b {
  color: var(--green);
  background: #f1f7ed;
  border-color: #c6dcc1;
}
.wizard-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 22px 0 32px;
}
.wizard-footer > div {
  display: flex;
  gap: 9px;
  align-items: center;
}
.check-line {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: 12px;
  line-height: 1.8;
}
.check-line input {
  accent-color: var(--green);
  margin: 4px 0 0;
  flex-shrink: 0;
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px 18px;
}
.feature-grid label {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
}
.feature-grid input {
  accent-color: var(--green);
  margin: 0;
}
.info-box {
  padding: 15px 17px;
  background: #f0f5ed;
  border: 1px solid #e0eadc;
  border-radius: 7px;
  color: #56715e;
  font-size: 11px;
  line-height: 1.9;
  margin-top: 20px;
}
.notice {
  padding: 15px 18px;
  border: 1px solid #eed7b3;
  border-radius: 7px;
  background: #fff7e9;
  font-size: 12px;
  line-height: 1.8;
  margin-bottom: 20px;
  color: #815827;
}
.notice.error {
  border-color: #efc7ba;
  background: #fff3ef;
  color: #984c37;
}
.notice.success {
  border-color: #c4ddc2;
  background: #edf6e9;
  color: #397049;
}
.notice ul {
  padding-left: 20px;
  margin: 5px 0 0;
}
.notice a {
  color: inherit;
  text-decoration: underline;
}
.back-link {
  display: inline-flex;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  padding: 21px 0 0;
}
.gallery-drop {
  border: 1px dashed #b9cdb5;
  background: #f6faf3;
  border-radius: 9px;
  padding: 27px;
  text-align: center;
}
.gallery-drop h3 {
  font-size: 17px;
  margin-bottom: 9px;
}
.gallery-drop p {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 16px;
}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 18px;
}
.gallery-item {
  border: 1px solid var(--line);
  background: #fcfdfb;
  border-radius: 7px;
  overflow: hidden;
}
.gallery-item img {
  width: 100%;
  height: 95px;
  object-fit: cover;
}
.gallery-item .photo-tools {
  padding: 8px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}
.photo-tools button {
  font-size: 10px;
  padding: 3px;
  color: var(--green);
}
.photo-tools .cover-tag {
  font-size: 8px;
  color: var(--green);
  margin-right: auto;
  background: var(--mint);
  padding: 3px 5px;
  border-radius: 3px;
}
.studio-section {
  margin-top: 24px;
  border-top: 1px solid var(--line);
  padding-top: 22px;
}
.studio-heading {
  display: flex;
  align-items: center;
  gap: 15px;
  justify-content: space-between;
  margin-bottom: 15px;
}
.studio-heading h3 {
  font-size: 17px;
  margin-bottom: 5px;
}
.studio-heading p {
  font-size: 11px;
  color: var(--muted);
}
.studio-host {
  border: 1px solid var(--line);
  border-radius: 9px;
  overflow: hidden;
  background: #f6f8f4;
}
.studio-frame {
  border: 0;
  width: 100%;
  display: block;
  min-height: 680px;
  background: #f6f8f4;
}
.studio-loading {
  padding: 20px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}
.studio-caption {
  font-size: 10px;
  color: var(--muted);
  padding: 10px 0;
  line-height: 1.8;
}
.results-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 26px 0 16px;
  gap: 15px;
}
.results-top h2 {
  font-size: 20px;
}
.results-top select {
  padding: 9px;
  border: 1px solid var(--line);
  background: white;
  border-radius: 6px;
  font-size: 11px;
}
.car-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.car-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.card-image {
  display: block;
  width: 100%;
  padding: 0;
  position: relative;
  background: #eaf0e5;
  text-align: left;
}
.card-image img {
  width: 100%;
  height: 196px;
  object-fit: cover;
}
.card-image .empty-car {
  height: 196px;
}
.pill {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  border-radius: 20px;
  background: var(--mint);
  color: var(--green);
  font-size: 9px;
  font-weight: 700;
  padding: 6px 9px;
  white-space: nowrap;
}
.image-pill {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: #fffef4ed;
  color: var(--green);
  border: 1px solid #e4ebdc;
}
.car-card-body {
  padding: 18px;
}
.car-card-body h3 {
  font-size: 17px;
  line-height: 1.5;
  margin-bottom: 9px;
}
.car-card-body h3 button {
  text-align: left;
  padding: 0;
  font-weight: 700;
}
.car-card-body .price {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.4px;
}
.card-meta {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.9;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 13px;
  font-size: 10px;
  color: var(--muted);
}
.empty-state {
  padding: 55px 25px;
  background: white;
  border: 1px dashed #cbd9c5;
  border-radius: 11px;
  text-align: center;
}
.empty-state svg {
  width: 155px;
  height: 90px;
  fill: none;
  stroke: #91aa9b;
  stroke-width: 1.1;
  margin: 0 auto 18px;
}
.empty-state h2 {
  font-size: 22px;
  margin-bottom: 10px;
}
.empty-state p {
  font-size: 12px;
  max-width: 510px;
  margin: 0 auto 20px;
  color: var(--muted);
}
.empty-car {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #edf3e8;
  color: #8ca491;
}
.empty-car svg {
  width: 150px;
  height: 95px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.1;
}
.trust-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin: 28px 0 38px;
}
.trust-row > div {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f0f5ec;
  padding: 19px;
}
.trust-row b {
  font-size: 12px;
  display: block;
  margin-bottom: 7px;
}
.trust-row p {
  font-size: 11px;
  color: var(--muted);
}
.garage-row {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) auto;
  gap: 22px;
  align-items: center;
  background: white;
  border: 1px solid var(--line);
  padding: 16px;
  border-radius: 9px;
  margin-bottom: 14px;
}
.garage-row > img,
.garage-row > .empty-car {
  width: 150px;
  height: 110px;
  object-fit: cover;
  border-radius: 6px;
}
.garage-row h2 {
  font-size: 19px;
  line-height: 1.5;
  margin: 7px 0;
}
.garage-row p {
  font-size: 11px;
  color: var(--muted);
}
.garage-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  max-width: 270px;
}
.sold-pill {
  background: #f4eee0;
  color: #8a6c37;
}
.draft-pill {
  background: #eef0f2;
  color: #66747c;
}
.listing-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 24px;
  align-items: start;
}
.detail-heading {
  padding: 28px 0 23px;
}
.detail-heading h1 {
  font-size: 31px;
  line-height: 1.5;
  margin-bottom: 7px;
  overflow-wrap: anywhere;
}
.detail-heading p {
  font-size: 12px;
  color: var(--muted);
}
.detail-gallery {
  border: 1px solid var(--line);
  background: white;
  border-radius: 10px;
  overflow: hidden;
}
.detail-media-tabs {
  display: flex;
  gap: 5px;
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.detail-media-tabs button {
  font-size: 11px;
  padding: 9px 13px;
  border-radius: 5px;
}
.detail-media-tabs button.active {
  background: var(--mint);
  color: var(--green);
  font-weight: 700;
}
.detail-image {
  width: 100%;
  height: 410px;
  object-fit: contain;
  background: #edf1e8;
}
.detail-thumbs {
  display: flex;
  gap: 8px;
  overflow: auto;
  padding: 13px;
}
.detail-thumbs button {
  padding: 3px;
  border: 2px solid transparent;
  border-radius: 5px;
  flex: 0 0 86px;
}
.detail-thumbs button.active {
  border-color: var(--green);
}
.detail-thumbs img {
  width: 76px;
  height: 53px;
  object-fit: cover;
  border-radius: 2px;
}
.detail-copy {
  margin: 20px 0;
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 25px;
}
.detail-copy h2 {
  font-size: 18px;
  margin-bottom: 19px;
}
.spec-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px 20px;
}
.spec-grid dt {
  font-size: 10px;

r\">\n    \u003cdiv class=\"brand\">\u003cdiv class=\"brand-icon\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-scan\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"brand-name\">carview\u003c/div>\u003cdiv class=\"brand-country\">PAKISTAN\u003c/div>\u003c/div>\u003c/div>\n    \u003cspan class=\"header-label\">Your personal photo studio\u003c/span>\n    \u003cdiv class=\"header-actions\">\u003cspan class=\"pill\">\u003cspan class=\"dot\">\u003c/span> Browser edition\u003c/span>\u003cbutton class=\"button\" id=\"export\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-download\"/>\u003c/svg> Save HTML copy\u003c/button>\u003c/div>\n  \u003c/div>\u003c/header>\n  \u003cmain class=\"wrap\">\n    \u003cdiv class=\"intro\">\u003cdiv>\u003cdiv class=\"eyebrow\">YOUR CAR. EVERY ANGLE.\u003c/div>\u003ch1 id=\"heading\">A better look at your car.\u003c/h1>\u003cp class=\"subtitle\">Photos select karein. Drag karein. Har angle dekhein.\u003c/p>\u003c/div>\u003cdiv class=\"steps\" aria-label=\"How it works\">\u003cspan class=\"step\">\u003cb>01\u003c/b> Upload photos\u003c/span>\u003cspan class=\"step\">\u003cb>02\u003c/b> Check order\u003c/span>\u003cspan class=\"step\">\u003cb>03\u003c/b> Explore\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"notice\" id=\"notice\" role=\"status\" hidden>\u003cspan id=\"notice-text\">\u003c/span>\u003cbutton id=\"dismiss\" aria-label=\"Dismiss message\">×\u003c/button>\u003c/div>\n    \u003cdiv class=\"workspace\">\n      \u003csection aria-label=\"Your car photo viewer\">\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"viewer-top\">\u003cspan class=\"viewer-label\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-camera\"/>\u003c/svg>\u003cspan id=\"view-mode\">PHOTO WALK-AROUND\u003c/span>\u003c/span>\u003cspan class=\"angle-total\" id=\"angle-total\">Ready for your photos\u003c/span>\u003c/div>\n          \u003cdiv class=\"viewer-tools\" aria-label=\"Viewer interaction\">\u003cbutton class=\"mode-button\" id=\"rotate-mode\" aria-pressed=\"true\" disabled>↔ Rotate car\u003c/button>\u003cbutton class=\"mode-button\" id=\"inspect-mode\" aria-pressed=\"false\" disabled>⊕ Inspect details\u003c/button>\u003cbutton class=\"mode-button fit-button\" id=\"fit\" disabled>Fit car\u003c/button>\u003cspan class=\"gesture-help\" id=\"gesture-help\">Drag to rotate · Pinch or scroll to zoom\u003c/span>\u003c/div>\n          \u003cdiv class=\"stage\" id=\"stage\" tabindex=\"0\" role=\"group\" aria-label=\"Interactive car viewer. Drag to rotate, pinch or scroll to zoom. In Inspect details mode, drag to move around the enlarged photo. Arrow keys change angle; 0 fits the car.\">\n            \u003cdiv class=\"empty\" id=\"empty\">\u003cdiv class=\"empty-art\">\u003csvg aria-hidden=\"true\" viewBox=\"0 0 160 80\">\u003cuse href=\"#icon-car\"/>\u003c/svg>\u003cspan>360°\u003c/span>\u003c/div>\u003ch2>Take a walk around your car.\u003c/h2>\u003cp>Photos select karein ya car ke gird banayi video lein.\u003cbr>36–72 clear angles se rotation zyada smooth lagegi.\u003c/p>\u003cbutton class=\"button primary\" data-upload>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-upload\"/>\u003c/svg> Choose car photos\u003c/button>\u003cbutton class=\"text-button\" data-video style=\"margin-top:10px\">Or choose a walk-around video\u003c/button>\u003csmall>Photos and video stay on this device\u003c/small>\u003c/div>\n            \u003cimg id=\"photo\" alt=\"\" draggable=\"false\" hidden>\n            \u003cdiv class=\"frame-badge\" id=\"frame-badge\" aria-live=\"polite\" hidden>\u003cb id=\"frame-number\">01\u003c/b> \u003cspan id=\"frame-count\">/ 01 photos\u003c/span>\u003c/div>\n            \u003cspan class=\"drag-hint\" id=\"drag-hint\" hidden>↔ Drag or swipe to explore\u003c/span>\n            \u003cbutton class=\"button stage-fullscreen-exit\" id=\"exit-fullscreen\">Exit fullscreen\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"controls\">\n            \u003cbutton class=\"icon-button\" id=\"previous\" aria-label=\"Previous photo\" disabled>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-left\"/>\u003c/svg>\u003c/button>\n            \u003cbutton class=\"icon-button play\" id=\"play\" aria-label=\"Play photo sequence\" disabled>\u003csvg aria-hidden=\"true\">\u003cuse id=\"play-icon\" href=\"#icon-play\"/>\u003c/svg>\u003c/button>\n            \u003cbutton class=\"icon-button\" id=\"next\" aria-label=\"Next photo\" disabled>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-right\"/>\u003c/svg>\u003c/button>\n            \u003cinput type=\"range\" id=\"angle\" aria-label=\"Photo angle\" min=\"0\" max=\"0\" value=\"0\" disabled>\n            \u003cbutton class=\"icon-button\" id=\"zoom-out\" aria-label=\"Zoom out\" disabled>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-minus\"/>\u003c/svg>\u003c/button>\u003cspan class=\"zoom-label\" id=\"zoom-label\">1×\u003c/span>\u003cbutton class=\"icon-button\" id=\"zoom-in\" aria-label=\"Zoom in\" disabled>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-plus\"/>\u003c/svg>\u003c/button>\n            \u003cspan class=\"divider\">\u003c/span>\u003cbutton class=\"icon-button\" id=\"fullscreen\" aria-label=\"Open photo full screen\" disabled>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-expand\"/>\u003c/svg>\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"caption-row\">\u003cspan class=\"filename\" id=\"filename\">Your actual photos, in your chosen order.\u003c/span>\u003cspan id=\"sequence-status\">Partial sequences stop at the ends.\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"busy\" class=\"busy-line\" role=\"status\" hidden>\u003cdiv class=\"busy-controls\">\u003cspan id=\"busy-text\">Preparing photos…\u003c/span>\u003cbutton class=\"button\" id=\"cancel-import\" hidden>Cancel\u003c/button>\u003c/div>\u003cprogress class=\"progress\" id=\"progress\" max=\"1\" value=\"0\">\u003c/progress>\u003c/div>\n        \u003cdiv class=\"film-header\">\u003ch2>Your photo sequence \u003cspan id=\"sequence-count\">0 photos\u003c/span>\u003c/h2>\u003cdiv class=\"film-actions\">\u003cbutton id=\"sort\" disabled>Sort by filename\u003c/button>\u003cbutton data-upload>+ Add photos\u003c/button>\u003c/div>\u003c/div>\n        \u003cdiv class=\"filmstrip\" id=\"filmstrip\" aria-label=\"Choose a photo\">\u003cdiv class=\"empty-film\">Your photos will appear here. Use filenames like 01-front.jpg, 02-front-left.jpg, 03-left.jpg to keep them in order.\u003c/div>\u003c/div>\n        \u003cdiv class=\"selection-tools\" id=\"selection-tools\" hidden>\u003cspan id=\"selected-label\">Selected photo\u003c/span>\u003cbutton class=\"button\" id=\"move-left\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-left\"/>\u003c/svg> Move earlier\u003c/button>\u003cbutton class=\"button\" id=\"move-right\">Move later \u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-right\"/>\u003c/svg>\u003c/button>\u003cbutton class=\"button remove\" id=\"remove\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-trash\"/>\u003c/svg> Remove\u003c/button>\u003c/div>\n        \u003cdiv class=\"guide\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-info\"/>\u003c/svg>\u003cdiv>\u003ch3>A smoother view starts with a steady walk.\u003c/h3>\u003cp>Park the car, then photograph one complete lap in the same direction. Keep the camera at a similar height and distance. This view plays your real photos in order; unseen angles are not generated. \u003cbutton class=\"text-button\" id=\"help\">Quick guide\u003c/button>\u003c/p>\u003c/div>\u003c/div>\n      \u003c/section>\n      \u003caside class=\"aside\" aria-label=\"Photo upload and car details\">\n        \u003cdiv class=\"card aside-card\">\u003cdiv class=\"aside-eyebrow\">TWO WAYS TO CREATE YOUR VIEW\u003c/div>\u003ch2>Your car. All around.\u003c/h2>\n          \u003cdiv class=\"source-tabs\" role=\"tablist\" aria-label=\"Choose upload type\">\u003cbutton id=\"photos-tab\" role=\"tab\" aria-selected=\"true\" aria-controls=\"photos-panel\">Photos\u003c/button>\u003cbutton id=\"video-tab\" role=\"tab\" aria-selected=\"false\" aria-controls=\"video-panel\" tabindex=\"-1\">Video\u003c/button>\u003c/div>\n          \u003cdiv id=\"photos-panel\" role=\"tabpanel\" aria-labelledby=\"photos-tab\">\u003cp>Car ke gird ek direction mein 36–72 photos lein. Filename ke order mein view tayyar ho jayega.\u003c/p>\u003cbutton class=\"button primary wide upload\" data-upload>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-upload\"/>\u003c/svg> Upload photos\u003c/button>\u003cp class=\"formats\">JPG, PNG, WebP · 10 MB each · 120 photos max\u003c/p>\u003c/div>\n          \u003cdiv id=\"video-panel\" class=\"video-panel\" role=\"tabpanel\" aria-labelledby=\"video-tab\" hidden>\u003cp>Park ki hui car ke gird ek poora chakkar lagate hue video lein. Camera ki height aur distance ek jaisi rakhein.\u003c/p>\u003cbutton class=\"button primary wide upload\" data-video>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-upload\"/>\u003c/svg> Choose video\u003c/button>\u003cp class=\"formats\">MP4 (H.264) recommended · up to 500 MB / 3 min\u003c/p>\u003cdiv id=\"video-settings\" hidden>\u003cvideo id=\"video-preview\" class=\"video-preview\" controls playsinline muted preload=\"auto\" aria-label=\"Walk-around video preview\">\u003c/video>\u003cdiv id=\"video-name\" class=\"video-name\">\u003c/div>\u003cdiv class=\"field-pair\">\u003cdiv class=\"field\">\u003clabel for=\"video-start\">Start (seconds)\u003c/label>\u003cinput id=\"video-start\" type=\"number\" min=\"0\" step=\"0.1\" value=\"0\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"video-end\">End (seconds)\u003c/label>\u003cinput id=\"video-end\" type=\"number\" min=\"0\" step=\"0.1\">\u003c/div>\u003c/div>\u003cdiv class=\"trim-tools\">\u003cbutton class=\"button\" id=\"set-video-start\">Start here\u003c/button>\u003cbutton class=\"button\" id=\"set-video-end\">End here\u003c/button>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"video-frames\">Frames to extract\u003c/label>\u003cselect id=\"video-frames\">\u003coption value=\"36\">36 · smaller file\u003c/option>\u003coption value=\"72\" selected>72 · smoother rotation\u003c/option>\u003coption value=\"120\">120 · more frames\u003c/option>\u003c/select>\u003c/div>\u003cbutton class=\"button primary wide video-create\" id=\"create-video\">Create photo view from video\u003c/button>\u003cp class=\"video-help\">Start/end par sirf ek poora chakkar rakhein. Successful import current sequence ko replace karega. Video ki original file apni jagah rehti hai.\u003c/p>\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"detail-quality\">Photo detail\u003c/label>\u003cselect id=\"detail-quality\">\u003coption value=\"1600\" selected>1600 px · save space\u003c/option>\u003coption value=\"2560\">2560 px · inspect more detail\u003c/option>\u003c/select>\u003c/div>\n          \u003cdiv class=\"loop-option\">\u003cinput type=\"checkbox\" id=\"loop\" disabled>\u003clabel for=\"loop\">These photos cover one complete lap. Enable 360° looping.\u003c/label>\u003c/div>\u003cp class=\"loop-help\" id=\"loop-help\">Add at least 12 photos, then check their order and coverage.\u003c/p>\u003cdiv class=\"storage\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#icon-check\"/>\u003c/svg>\u003cspan id=\"storage-status\" role=\"status\">Opening browser storage…\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"card aside-card\">\u003cdiv class=\"aside-eyebrow\">MAKE IT YOURS\u003c/div>\u003ch2>Car details\u003c/h2>\u003cform id=\"details\" autocomplete=\"off\">\u003cdiv class=\"field\">\u003clabel for=\"car-title\">Make &amp; model\u003c/label>\u003cinput id=\"car-title\" name=\"title\" maxlength=\"90\" placeholder=\"e.g. Toyota Corolla GLi\">\u003c/div>\u003cdiv class=\"field-pair\">\u003cdiv class=\"field\">\u003clabel for=\"car-year\">Year\u003c/label>\u003cinput id=\"car-year\" name=\"year\" maxlength=\"4\" inputmode=\"numeric\" placeholder=\"2020\">\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"car-city\">City\u003c/label>\u003cinput id=\"car-city\" name=\"city\" maxlength=\"60\" placeholder=\"Lahore\">\u003c/div>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"car-notes\">Your notes\u003c/label>\u003ctextarea id=\"car-notes\" name=\"notes\" maxlength=\"1500\" placeholder=\"Add anything you want to remember…\">\u003c/textarea>\u003c/div>\u003c/form>\u003cp style=\"margin-top:14px\">Save HTML copy se photos aur details wali file download karein. Us file ko dobara double-click karke khol sakte hain.\u003c/p>\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/main>\n  \u003cfooter class=\"footer\">\u003cdiv class=\"wrap footer-inner\">\u003cspan>Made for Pakistan. Built for a closer look.\u003c/span>\u003cspan class=\"footer-right\">Offline · No installation · Photos stay on this device\u003c/span>\u003c/div>\u003c/footer>\n  \u003cinput class=\"file-input\" id=\"files\" type=\"file\" accept=\"image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp\" multiple aria-label=\"Choose car photographs\">\n  \u003cinput class=\"file-input\" id=\"video-file\" type=\"file\" accept=\"video/*,.mp4,.mov,.webm\" aria-label=\"Choose a car walk-around video\">\n  \u003cdialog class=\"help-dialog\" id=\"help-dialog\">\u003ch2>Photos or video. Every angle.\u003c/h2>\u003col>\u003cli>\u003cstrong>Photos:\u003c/strong> car ke gird ek direction mein 36–72 clear photos lein. Upload photos se select karein. Filenames ke order mein view banega; Move earlier / Move later se order theek karein.\u003c/li>\u003cli>\u003cstrong>Video:\u003c/strong> parked car ke gird ek poora chakkar record karein, takreeban 20–60 seconds. Video tab se file select karein. Preview mein start/end time set karein, 36 / 72 / 120 frames choose karke Create photo view dabayein. MP4 (H.264) sab se zyada compatible hai; doosre formats browser support par depend karte hain.\u003c/li>\u003cli>\u003cstrong>Rotate:\u003c/strong> Rotate car mode mein ek ungli se drag karein. Arrows, keyboard ya slider se bhi angle badalta hai.\u003c/li>\u003cli>\u003cstrong>Inspect:\u003c/strong> do ungliyon se pinch, mouse wheel, + button ya double-click se zoom karein. Inspect details mein drag karke mirror, doors ya lights dekhein. Zoom rakh kar angle badalne ke liye Rotate car ya slider use karein. Fit car / keyboard 0 se reset hota hai.\u003c/li>\u003cli>\u003cstrong>Poora chakkar:\u003c/strong> sequence ka order aur coverage check karein. 12+ frames hon aur ek full lap cover ho to Enable 360 looping tick karein. Video import khud coverage verify nahi karta.\u003c/li>\u003cli>\u003cstrong>Save:\u003c/strong> Save HTML copy se photos/frames aur details wali file save karein. Dobara Chrome/Edge mein double-click se khol sakte hain; original video ki zaroorat nahi hogi.\u003c/li>\u003c/ol>\u003cp>Normal quality 1600px tak display copies banati hai. More detail ke liye import se pehle 2560px choose karein. Zoom source photo/video ki available detail dikhata hai. Steady camera, clear focus aur similar distance se result behtar hota hai.\u003c/p>\u003cp style=\"margin-top:10px\">Browser storage isi profile par hoti hai; clear karne se photos hat sakti hain. Saved HTML copy mein frames rehti hain. Yeh captured angles ka interactive photo viewer hai; unseen sides ya freely movable 3D scene generate nahi hota.\u003c/p>\u003cbutton class=\"button primary wide\" id=\"close-help\">Got it\u003c/button>\u003c/dialog>\n  \u003cscript type=\"application/json\" id=\"carview-data\">null\u003c/script>\n  \u003cscript>\n  (() => {\n    'use strict';\n    // This file has no runtime dependencies and never sends photos over the network.\n    const template = '\u003c!doctype html>\\n' + document.documentElement.outerHTML;\n    const $ = id => document.getElementById(id);\n    const uid = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2);\n    const initial = () => ({version:1,id:uid(),title:'',year:'',city:'',notes:'',loop:false,photos:[]});\n    let state = initial(), frame = 0, zoom = 1, timer = null, processing = false, db = null, storageKey = 'workspace';\n    let saveTimer = null, saveQueue = Promise.resolve(), revision = 0;\n    let panX = 0, panY = 0, interaction = 'rotate', gesture = null;\n    const pointers = new Map();\n    let videoURL = null, videoName = '', videoLoading = false, importController = null, videoLoadController = null;\n    let lastPhotoId = '', warmed = [];\n    const collator = new Intl.Collator(undefined, {numeric:true,sensitivity:'base'});\n    const imagePattern = /^data:image\\/(?:jpeg|webp|png);base64,[A-Za-z0-9+/=]+$/;\n    function validated(value) {\n      if (!value || value.version !== 1 || !Array.isArray(value.photos) || value.photos.length > 120) throw new Error('This saved file has an unsupported photo format.');\n      const result = initial();\n      if (typeof value.id === 'string' && value.id.length \u003c= 100) result.id = value.id;\n      for (const [key,max] of [['title',90],['year',4],['city',60],['notes',1500]]) result[key] = typeof value[key] === 'string' ? value[key].slice(0,max) : '';\n      const ids = new Set();\n      for (const photo of value.photos) {\n        if (!photo || typeof photo.src !== 'string' || photo.src.length > 16000000 || !imagePattern.test(photo.src) || typeof photo.thumb !== 'string' || photo.thumb.length > 500000 || !imagePattern.test(photo.thumb)) throw new Error('This saved file contains an invalid image.');\n        const id = typeof photo.id === 'string' && !ids.has(photo.id) ? photo.id.slice(0,100) : uid();\n        ids.add(id);\n        result.photos.push({id,name:String(photo.name || 'Car photo').slice(0,180),src:photo.src,thumb:photo.thumb});\n      }\n      result.loop = value.loop === true && result.photos.length >= 12;\n      return result;\n    }\n    function notice(message, error = false) {\n      $('notice-text').textContent = message;\n      $('notice').classList.toggle('error',error);\n      $('notice').hidden = false;\n    }\n    function storageStatus(message) { $('storage-status').textContent = message; }\n    function openStorage() {\n      return new Promise((resolve,reject) => {\n        let request;\n        try { request = indexedDB.open('carview-browser-v1',1); } catch (e) { reject(e); return; }\n        let expired = false;\n        const timeout = setTimeout(() => { expired = true; reject(new Error('Browser storage did not open.')); },3000);\n        request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains('projects')) request.result.createObjectStore('projects'); };\n        request.onerror = () => { clearTimeout(timeout); reject(request.error); };\n        request.onblocked = () => { clearTimeout(timeout); expired = true; reject(new Error('Browser storage is busy.')); };\n        request.onsuccess = () => {\n          clearTimeout(timeout);\n          if (expired) { request.result.close(); return; }\n          const connection = request.result;\n          connection.onversionchange = () => { connection.close(); db = null; storageStatus('Session only · save an HTML copy'); };\n          resolve(connection);\n        };\n      });\n    }\n    function readStored() {\n      return new Promise((resolve,reject) => {\n        const request = db.transaction('projects','readonly').objectStore('projects').get(storageKey);\n        request.onsuccess = () => resolve(request.result);\n        request.onerror = () => reject(request.error);\n      });\n    }\n    function scheduleSave() {\n      revision++;\n      clearTimeout(saveTimer);\n      if (!db) { storageStatus('Session only · save an HTML copy'); return; }\n      storageStatus('Saving to this browser…');\n      saveTimer = setTimeout(saveNow,250);\n    }\n    function saveNow() {\n      clearTimeout(saveTimer); saveTimer = null;\n      if (!db) return;\n      const snapshot = {...state,photos:state.photos.map(p => ({...p}))}, version = revision;\n      saveQueue = saveQueue.catch(() => {}).then(() => new Promise((resolve,reject) => {\n        if (!db) { resolve(); return; }\n        const transaction = db.transaction('projects','readwrite');\n        transaction.objectStore('projects').put(snapshot,storageKey);\n        transaction.oncomplete = () => { if (version === revision) storageStatus('Saved in this browser · ' + photoSize()); resolve(); };\n        transaction.onerror = transaction.onabort = () => reject(transaction.error || new Error('Storage is full.'));\n      })).catch(() => {\n        storageStatus('Not saved · use Save HTML copy');\n        notice('Browser photos save nahi kar saka (storage full ya blocked). “Save HTML copy” se apni photos wali file abhi save kar lein.',true);\n      });\n    }\n    function photoSize() {\n      const bytes = state.photos.reduce((n,p) => n + (p.src.length + p.thumb.length) * .75,0);\n      return bytes \u003c 1048576 ? Math.round(bytes/1024) + ' KB photos' : (bytes/1048576).toFixed(1) + ' MB photos';\n    }\n    function stop() {\n      clearInterval(timer); timer = null;\n      $('play').setAttribute('aria-label','Play photo sequence');\n      $('play-icon').setAttribute('href','#icon-play');\n    }\n    function choose(index, fromPlayback = false) {\n      if (!fromPlayback) stop();\n      const count = state.photos.length;\n      frame = count ? state.loop ? ((index % count) + count) % count : Math.min(count-1,Math.max(0,index)) : 0;\n      renderViewer();\n    }\n    function clampPan() {\n      const stage = $('stage'), image = $('photo');\n      const scale = image.naturalWidth ? Math.min(stage.clientWidth/image.naturalWidth,stage.clientHeight/image.naturalHeight) : 1;\n      const maxX = Math.max(0,((image.naturalWidth || stage.clientWidth)*scale*zoom-stage.clientWidth)/2);\n      const maxY = Math.max(0,((image.naturalHeight || stage.clientHeight)*scale*zoom-stage.clientHeight)/2);\n      panX = Math.max(-maxX,Math.min(maxX,panX));\n      panY = Math.max(-maxY,Math.min(maxY,panY));\n    }\n    function renderTransform() {\n      clampPan();\n      $('photo').style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';\n      $('zoom-label').textContent = Number(zoom.toFixed(2)) + '×';\n      $('zoom-out').disabled = !state.photos.length || zoom \u003c= 1;\n      $('zoom-in').disabled = !state.photos.length || zoom >= 6;\n      $('rotate-mode').disabled = $('inspect-mode').disabled = $('fit').disabled = !state.photos.length;\n      $('rotate-mode').setAttribute('aria-pressed',String(interaction === 'rotate'));\n      $('inspect-mode').setAttribute('aria-pressed',String(interaction === 'inspect'));\n      $('gesture-help').textContent = interaction === 'inspect' ? 'Drag to move photo · Arrows/slider change angle · Pinch to zoom' : 'Drag to rotate · Pinch or scroll to zoom';\n      $('drag-hint').textContent = interaction === 'inspect' ? '↔ Drag to inspect · Slider changes angle' : '↔ Drag or swipe to rotate';\n    }\n    function setZoom(value, point = null) {\n      stop();\n      const box = $('stage').getBoundingClientRect();\n      const x = point ? point.x-box.left-box.width/2 : 0, y = point ? point.y-box.top-box.height/2 : 0;\n      const next = Math.max(1,Math.min(6,value)), ratio = next/zoom;\n      panX = x-(x-panX)*ratio; panY = y-(y-panY)*ratio; zoom = next;\n      interaction = zoom > 1 ? 'inspect' : 'rotate';\n      if (zoom === 1) panX = panY = 0;\n      renderTransform();\n    }\n    function fitCar() {\n      stop(); zoom = 1; panX = panY = 0; interaction = 'rotate'; renderTransform();\n    }\n    function beginGesture() {\n      const points = Array.from(pointers.values());\n      if (points.length >= 2) {\n        const a = points[0], b = points[1], box = $('stage').getBoundingClientRect();\n        const x = (a.x+b.x)/2-box.left-box.width/2, y = (a.y+b.y)/2-box.top-box.height/2;\n        gesture = {k function allErrors(ad) {

function openDatabase() {
  return new Promise((resolve, reject) => {
    let request;
    try {
      request = indexedDB.open("carview-marketplace-v1", 1);
    } catch (error) {
      reject(error);
      return;
    }
    let expired = false;
    const timeout = setTimeout(() => {
      expired = true;
      reject(new Error("Browser storage did not open."));
    }, 3000);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains("state"))
        request.result.createObjectStore("state");
    };
    request.onerror = () => {
      clearTimeout(timeout);
      reject(request.error);
    };
    request.onblocked = () => {
      clearTimeout(timeout);
      expired = true;
      reject(new Error("Browser storage is busy."));
    };
    request.onsuccess = () => {
      clearTimeout(timeout);
      if (expired) {
        request.result.close();
        return;
      }
      const connection = request.result;
      connection.onversionchange = () => {
        connection.close();
        database = null;
        storageLabel("Session only · download a backup");
      };
      resolve(connection);
    };
  });
}
function storedState() {
  return new Promise((resolve, reject) => {
    const request = database
      .transaction("state", "readonly")
      .objectStore("state")
      .get(marketStorageKey);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function storageLabel(message) {
  $("storage-status").textContent = message;
}
function persist(ad = null) {
  if (ad) ad.updatedAt = Date.now();
  revision++;
  clearTimeout(saveTimer);
  if (!database) {
    storageLabel("Session only · download your ad/backup before closing");
    return;
  }
  storageLabel("Saving on this device…");
  saveTimer = setTimeout(saveNow, 400);
}
function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!database) return Promise.resolve();
  const snapshot = structuredClone(appState),
    version = revision;
  saveQueue = saveQueue
    .catch(() => {})
    .then(
      () =>
        new Promise((resolve, reject) => {
          if (!database) {
            resolve();
            return;
          }
          const transaction = database.transaction("state", "readwrite");
          transaction.objectStore("state").put(snapshot, marketStorageKey);
          transaction.oncomplete = () => {
            if (version === revision) storageLabel("Saved on this device");
            resolve();
          };
          transaction.onerror = transaction.onabort = () =>
            reject(transaction.error || new Error("Storage full"));
        }),
    )
    .catch(() => {
      storageLabel("Not saved · download a backup");
      toast(
        "Browser storage is full or blocked. Download your ad or a backup before closing.",
      );
    });
  return saveQueue;
}

  clearTimeout(toastTimer);
  $("toast").textContent = message;

}

// The original studio is embedded unchanged. This wrapper handles only host
// integration, portable snapshot capture, sizing and buyer/editor presentation.
const STUDIO_HTML = JSON.parse($("studio-source").textContent);
function studioBridge(config) {
  const send = (type, extra = {}) =>
    parent.postMessage(
      { type: "carview:" + type, token: config.token, ...extra },
      "*",
    );
  let capture = null,
    dirty = false,
    debounce = null;
  const nativeClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (this.href.startsWith("blob:") && this.download.endsWith(".html")) {
      const request = capture;
      capture = null;
      void fetch(this.href)
        .then((response) => response.text())
        .then((text) => {
          const parsed = new DOMParser().parseFromString(text, "text/html");
          const project = JSON.parse(
            parsed.getElementById("carview-data").textContent,
          );
          send("snapshot", { requestId: request?.id || null, project });
        })
        .catch((error) =>
          send("error", {
            requestId: request?.id || null,
            message: "Could not save the 360 view: " + error.message,
          }),
        );
      if (request) return;
    }
    nativeClick.call(this);
  };
  function snapshot(id) {
    const button = document.getElementById("export");
    if (!button || button.disabled || !document.getElementById("busy").hidden) {
      send("error", {
        requestId: id,
        message:
          "360 processing is still running. Let it finish or cancel it before continuing.",
      });
      return;
    }
    const box = document.getElementById("notice"),
      text = document.getElementById("notice-text");
    const before = {
      hidden: box.hidden,
      text: text.textContent,
      className: box.className,
    };
    capture = { id };
    button.click();
    // A host snapshot is a save, not a user-requested standalone download.
    box.hidden = before.hidden;
    text.textContent = before.text;
    box.className = before.className;
    if (capture) {
      capture = null;
      send("error", {
        requestId: id,
        message:
          "Could not capture the 360 view. Please try its Save HTML copy button.",
      });
    }
  }
  function changed() {
    dirty = true;
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      if (!dirty) return;
      if (!document.getElementById("busy").hidden) {
        changed();
        return;
      }
      dirty = false;
      snapshot(null);
    }, 700);
  }
  window.addEventListener("message", (event) => {
    if (event.source !== parent || event.data?.token !== config.token) return;
    if (event.data.type === "carview:capture") snapshot(event.data.requestId);
    if (event.data.type === "carview:storage")
      document.getElementById("storage-status").textContent =
        event.data.message;
  });
  function ready() {
    if (document.documentElement.dataset.ready !== "true") return false;
    // The host owns persistence. A sandboxed child intentionally has no IndexedDB.
    const box = document.getElementById("notice");
    if (
      document
        .getElementById("notice-text")
        .textContent.includes("Browser storage available nahi")
    )
      box.hidden = true;
    document.getElementById("storage-status").textContent = config.readOnly
      ? "Included in this car ad"
      : "360 photos save with this ad";
    if (!config.readOnly) {
      new MutationObserver(changed).observe(
        document.getElementById("filmstrip"),
        { childList: true },
      );
      document.getElementById("loop").addEventListener("change", changed);
    }
    let lastHeight = 0;
    const resize = () => {
      const height = Math.ceil(document.body.scrollHeight);
      if (Math.abs(height - lastHeight) > 2) {
        lastHeight = height;
        send("height", { height });
      }
    };
    new ResizeObserver(resize).observe(document.body);
    resize();
    send("ready");
    return true;
  }
  if (!ready()) {
    const observer = new MutationObserver(() => {
      if (ready()) observer.disconnect();
    });
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-ready"],
    });
  }
}
function mountStudio(host, ad, readOnly = false) {
  const iframe = document.createElement("iframe");

    : ".brand,.header-label,.header-actions>.pill,.intro,.footer,.aside-card:nth-child(2){display:none!important}.header-inner{min-height:54px!important;padding:0 16px!important;max-width:none!important}.header-actions{margin-left:auto!important}main.wrap{padding:15px!important;max-width:none!important}.workspace{grid-template-columns:minmax(0,1fr) 250px!important;gap:15px!important}.stage{height:330px!important}.guide{margin-bottom:0!important}@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr)!important}.aside{display:block!important}.stage{height:300px!important}}";
  doc.body.append(style);

function studioMessage(event) {
  const studio = activeStudio,
    message = event.data;
  if (
    !studio ||
    event.source !== studio.iframe.contentWindow ||
    message?.token !== studio.token ||
    typeof message.type !== "string"
  )
    return;
  if (message.type === "carview:height" && Number.isFinite(message.height))
    studio.iframe.style.height =
      Math.max(studio.readOnly ? 450 : 650, Math.min(6000, message.height)) +
      "px";
  if (message.type === "carview:ready") {
    studio.ready = true;
    studio.resolveReady();
  }
  if (message.type === "carview:snapshot" && !studio.readOnly) {
    const pending = studio.pending.get(message.requestId);
    if (pending) {
      clearTimeout(pending.timer);
      studio.pending.delete(message.requestId);
    }
    try {
      const ad = appState.ads.find((ad) => ad.id === studio.adId);
      if (!ad) throw new Error("The draft is no longer available.");
      const project = cleanStudio(message.project);
      project.id = ad.studio.id;
      ad.studio = project;
      persist(ad);
      updateMediaSummary(ad);
      pending?.resolve(project);
    } catch (error) {
      pending?.reject(error);
      toast(error.message);
    }
  }
  if (message.type === "carview:error") {
    const pending = studio.pending.get(message.requestId);
    if (pending) {
      clearTimeout(pending.timer);
      studio.pending.delete(message.requestId);
      pending.reject(new Error(message.message));
    } else toast(message.message || "Could not save the 360 view.");
  }
}
async function captureStudio() {
  const studio = activeStudio;
  if (!studio || studio.readOnly) return;
  if (!studio.ready)
    await Promise.race([
      studio.readyPromise,
      new Promise((_, reject) =>
        setTimeout(
          () =>
            reject(
              new Error(
                "The 360 studio is still opening. Try again in a moment.",
              ),
            ),
          12000,
        ),
      ),
    ]);
  return await new Promise((resolve, reject) => {
    const requestId = uid(),
      timer = setTimeout(() => {
        studio.pending.delete(requestId);
        reject(
          new Error("The 360 view could not be saved yet. Please try again."),
        );
      }, 12000);
    studio.pending.set(requestId, { resolve, reject, timer });
    studio.iframe.contentWindow.postMessage(
      { type: "carview:capture", token: studio.token, requestId },
      "*",
    );
  });
}
function detachStudio() {
  if (activeStudio) {
    for (const entry of activeStudio.pending.values()) {
      clearTimeout(entry.timer);
      entry.reject(new Error("360 view closed."));
    }
    activeStudio = null;
  }
}

function render() {
  detachStudio();

  $("nav-browse").classList.toggle(
    "active",
    view.kind === "browse" || view.kind === "detail",
  );
  $("nav-garage").classList.toggle(
    "active",
    view.kind === "garage" || view.kind === "wizard",
  );
  const ad = currentAd();
  if ((view.kind === "wizard" || view.kind === "detail") && !ad)
    view = { kind: "browse" };
  document.title =
    ad && (view.kind === "wizard" || view.kind === "detail")
      ? titleOf(ad) + " · CarView Pakistan"
      : "CarView Pakistan · Your car, the complete picture";
  $("app").innerHTML =
    view.kind === "wizard"
      ? renderWizard(ad, view.step)
      : view.kind === "garage"
        ? renderGarage()
        : view.kind === "detail"
          ? renderDetail(ad)
          : renderBrowse();
  if (view.kind === "wizard" && view.step === 3) {
    updateMediaSummary(ad);
    mountStudio($("studio-host"), ad);
  } else if (
    (view.kind === "detail" || (view.kind === "wizard" && view.step === 5)) &&
    ad.studio.photos.length &&
    !$("detail-studio").hidden
  )
    mountStudio($("detail-studio-host"), ad, true);
  if (Object.keys(formErrors).length) $("form-errors")?.focus();
}
async function navigate(next, skipCapture = false) {
  if (mediaBusy)
    throw new Error(
      "Let the photos finish preparing before leaving this step.",
    );
  if (!skipCapture) await captureStudio();
  await saveNow();
  view = next;
  formErrors = {};
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}
function showFormErrors(ad, step, errors) {
  formErrors = errors;
  ad.step = step;
  persist(ad);
  if (view.kind === "wizard" && view.step === 3 && step === 3) {
    $("form-errors")?.remove();
    $("app")
      .querySelector(".wizard-layout")
      .insertAdjacentHTML("beforebegin", validationBox());
    $("form-errors").focus();
  } else {
    view = { kind: "wizard", id: ad.id, step };
    render();
  }
}
async function changeStep(step) {
  if (mediaBusy) throw new Error("Let the photos finish preparing first.");
  await captureStudio();
  const ad = currentAd();
  if (!ad) return;
  if (step > view.step) {
    for (let index = 1; index < step; index++) {
      const errors = validateStep(ad, index);
      if (Object.keys(errors).length) {
        showFormErrors(ad, index, errors);
        return;
      }
    }
  }
  ad.step = step;
  persist(ad);
  await navigate({ kind: "wizard", id: ad.id, step }, true);
}

    $("field-customModel").value = ad.details.customModel;
    $("variants").innerHTML = (
      VARIANTS[ad.details.make + "|" + ad.details.model] || []
    )
      .map((value) => '<option value="' + esc(value) + '">')
      .join("");
    $("field-variant").value = "";
  }
}
function handleInput(event) {
  const element = event.target;
  if (element.matches("[data-filter]")) {
    filters[element.dataset.filter] = element.value.trim();
    return;
  }
  if (view.kind !== "wizard") return;
  const ad = currentAd();
  if (!ad) return;
  if (element.matches("[data-feature]")) {
    const feature = element.dataset.feature;
    if (!FEATURES.includes(feature)) return;
    ad.details.features = element.checked
      ? [...new Set([...ad.details.features, feature])]
      : ad.details.features.filter((value) => value !== feature);
    persist(ad);
    return;
  }
  const key = element.dataset.field,
    scope = element.dataset.scope;
  if (!key || !["details", "contact"].includes(scope) || !(key in ad[scope]))
    return;
  ad[scope][key] =
    element.type === "checkbox" ? element.checked : element.value;
  if (key === "make" || key === "model") updateDependencies(key, ad);
  if (key === "price") {
    if ($("price-words"))
      $("price-words").textContent = element.value
        ? "PKR " + priceWords(element.value)
        : "Your asking price";
    if ($("aside-price"))
      $("aside-price").textContent = element.value
        ? "PKR " + money(element.value)
        : "Not set yet";
  }
  if (formErrors[key]) {
    delete formErrors[key];
    element.closest(".field")?.classList.remove("error");
    element.removeAttribute("aria-invalid");
    $("error-" + key)?.remove();
    if ($("form-errors")) $("form-errors").outerHTML = validationBox();
  }
  persist(ad);
}
async function galleryPhoto(file) {
  if (file.size > 10 * 1024 * 1024) throw new Error("Maximum 10 MB per photo.");
  const header = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const jpeg = header[0] === 255 && header[1] === 216 && header[2] === 255,
    png = [137, 80, 78, 71, 13, 10, 26, 10].every(
      (value, index) => header[index] === value,
    ),
    webp =
      String.fromCharCode(...header.slice(0, 4)) === "RIFF" &&
      String.fromCharCode(...header.slice(8, 12)) === "WEBP";
  if (!jpeg && !png && !webp) throw new Error("Use a JPG, PNG or WebP image.");
  let image,
    cleanup = () => {};
  if (globalThis.createImageBitmap) {
    image = await createImageBitmap(file, { imageOrientation: "from-image" });
    cleanup = () => image.close();
  } else {
    const url = URL.createObjectURL(file);
    image = new Image();
    cleanup = () => URL.revokeObjectURL(url);
    try {
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error("Could not decode this image."));
        image.src = url;
      });
    } catch (error) {
      cleanup();
      throw error;
    }
  }
  try {
    if (!image.width || !image.height || image.width * image.height > 40000000)
      throw new Error("Maximum 40 megapixels.");
    const canvas = document.createElement("canvas"),
      scale = Math.min(1, 1600 / Math.max(image.width, image.height));
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const context = canvas.getContext("2d");
    context.fillStyle = "white";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const src = canvas.toDataURL("image/jpeg", 0.88);
    const thumb = document.createElement("canvas"),
      ratio = Math.min(1, 220 / Math.max(canvas.width, canvas.height));
    thumb.width = Math.max(1, Math.round(canvas.width * ratio));
    thumb.height = Math.max(1, Math.round(canvas.height * ratio));
    thumb.getContext("2d").drawImage(canvas, 0, 0, thumb.width, thumb.height);
    return {
      id: uid(),
      name: file.name.slice(0, 180),
      src,
      thumb: thumb.toDataURL("image/jpeg", 0.75),
    };
  } finally {
    cleanup();
  }
}
async function addGallery(files) {
  const ad = currentAd();
  if (!ad || mediaBusy) return;
  const remaining = 20 - ad.gallery.length;
  if (!remaining) {
    toast("This ad already has 20 photos. Remove one before adding more.");
    return;
  }
  const selected = Array.from(files).slice(0, remaining);
  if (!selected.length) return;
  mediaBusy = true;
  $("photo-busy").hidden = false;
  const errors = [];
  try {
    for (let index = 0; index < selected.length; index++) {
      $("photo-busy").textContent =
        "Preparing photo " + (index + 1) + " of " + selected.length + "…";
      try {
        ad.gallery.push(await galleryPhoto(selected[index]));
      } catch (error) {
        errors.push(selected[index].name + ": " + error.message);
      }
    }
    $("gallery-grid").innerHTML = galleryItems(ad);
    updateMediaSummary(ad);
    persist(ad);
    toast(
      errors.length
        ? "Some photos could not be added: " + errors.slice(0, 2).join(" · ")
        : selected.length + " photos ready. The first photo is your ad cover.",
    );
  } finally {
    mediaBusy = false;
    $("photo-busy").hidden = true;
    $("gallery-files").value = "";
  }
}
async function importStudio(file) {
  if (!file || view.kind !== "wizard" || view.step !== 3) return;
  if (file.size > 100 * 1024 * 1024)
    throw new Error(
      "This saved HTML is over 100 MB. Use a smaller saved sequence.",
    );
  await captureStudio();
  const ad = currentAd();
  const parsed = new DOMParser().parseFromString(
      await file.text(),
      "text/html",
    ),
    data = parsed.getElementById("carview-data");
  if (!data)
    throw new Error(
      "Choose a saved CarView 360 HTML file, not a different webpage.",
    );
  const project = cleanStudio(JSON.parse(data.textContent));
  if (
    ad.studio.photos.length &&
    !confirm("Replace the current 360 sequence with this saved one?")
  )
    return;
  project.id = uid();
  ad.studio = project;
  persist(ad);
  render();
  toast(project.photos.length + " saved 360 frames added.");
}
function downloadState(ads, startId = null) {
  const copy = new DOMParser().parseFromString(PRISTINE_TEMPLATE, "text/html");
  const payload = {
    version: 1,
    ads: structuredClone(ads),
    copyId: uid(),
    startId,
    startView: startId ? null : "garage",
  };
  copy.getElementById("marketplace-data").textContent = jsonSafe(payload);
  const blob = new Blob(["<!doctype html>\n", copy.documentElement.outerHTML], {
      type: "text/html;charset=utf-8",
    }),
    url = URL.createObjectURL(blob),
    link = document.createElement("a");
  const ad = startId ? ads.find((ad) => ad.id === startId) : null;
  const filename = ad
    ? titleOf(ad)
        .replace(/[^a-zA-Z0-9 _-]/g, "")
        .slice(0, 65)
    : "CarView-My-Ads";
  link.href = url;
  link.download = (filename || "CarView-Ad") + ".html";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast(
    ad
      ? "Ad copy download started. It includes the photos, 360 view and seller contact."
      : "Backup download started. It includes all your ads, photos and contact details.",
  );
}
async function action(button) {
  const kind = button.dataset.action,
    id = button.dataset.id,
    ad = currentAd();
  if (mediaBusy) throw new Error("Let the photos finish preparing first.");
  if (kind === "browse") return navigate({ kind: "browse" });
  if (kind === "garage" || kind === "save-draft") {
    await navigate({ kind: "garage" });
    if (kind === "save-draft") toast("Your draft is in My ads.");
    return;
  }
  if (kind === "new-ad") {
    await captureStudio();
    if (appState.ads.length >= 25)
      throw new Error(
        "This local garage supports 25 ads. Back up and remove old ads before adding more.",
      );
    const created = newAd();
    appState.ads.unshift(created);
    persist(created);
    return navigate({ kind: "wizard", id: created.id, step: 1 }, true);
  }
  if (kind === "edit") {
    await captureStudio();
    const target = appState.ads.find((ad) => ad.id === id);
    if (!target) return;
    if (target.status !== "draft") {
      target.status = "draft";
      persist(target);
      toast(
        "Moved to drafts while you edit. Review and save it to the showroom again when ready.",
      );
    }
    return navigate({ kind: "wizard", id, step: target.step || 1 }, true);
  }
  if (kind === "detail") return navigate({ kind: "detail", id });
  if (kind === "next") return changeStep(Math.min(5, view.step + 1));
  if (kind === "previous") return changeStep(Math.max(1, view.step - 1));
  if (kind === "step")
    return changeStep(
      Math.max(1, Math.min(5, Number(button.dataset.step) || 1)),
    );
  if (kind === "choose-gallery") {
    $("gallery-files").click();
    return;
  }
  if (kind === "cover" || kind === "remove-photo") {
    const index = Number(button.dataset.index);
    if (!ad || !Number.isInteger(index) || !ad.gallery[index]) return;
    const [photo] = ad.gallery.splice(index, 1);
    if (kind === "cover") ad.gallery.unshift(photo);
    $("gallery-grid").innerHTML = galleryItems(ad);
    updateMediaSummary(ad);
    persist(ad);
    return;
  }
  if (kind === "import-studio") {
    $("studio-import").click();
    return;
  }
  if (kind === "list-ad") {
    await captureStudio();
    const invalid = allErrors(ad);
    if (invalid) {
      showFormErrors(ad, invalid.step, invalid.errors);
      return;
    }
    ad.status = "listed";
    ad.step = 5;
    persist(ad);
    await navigate({ kind: "detail", id: ad.id }, true);
    toast(
      "Your ad is in this browser’s showroom. Download an ad copy to share or open elsewhere.",
    );
    return;
  }
  if (kind === "delete-ad") {
    const target = appState.ads.find((ad) => ad.id === id);
    if (
      !target ||
      !confirm(
        "Delete this ad and its saved photos from this browser? " +
          titleOf(target),
      )
    )
      return;
    appState.ads = appState.ads.filter((ad) => ad.id !== id);
    persist();
    return navigate({ kind: "garage" });
  }
  if (kind === "sold") {
    const target = appState.ads.find((ad) => ad.id === id);
    if (target) {
      target.status = "sold";
      persist(target);
      render();
      toast("Marked as sold. It is no longer shown in Explore cars.");
    }
    return;
  }
  if (kind === "backup") {
    await captureStudio();
    downloadState(appState.ads);
    return;
  }
  if (kind === "download-ad") {
    await captureStudio();
    const target = appState.ads.find((ad) => ad.id === id);
    if (target) downloadState([target], target.id);
    return;
  }
  if (kind === "filters") {
    filters.more = !filters.more;
    $("app").querySelector(".search-more").hidden = !filters.more;
    button.textContent = filters.more ? "Fewer filters" : "More filters";
    return;
  }
  if (kind === "reset-filters") {
    for (const key of Object.keys(filters))
      filters[key] = key === "sort" ? "newest" : key === "more" ? false : "";
    render();
    return;
  }
  if (kind === "show-phone") {
    $("revealed-contact").hidden = false;
    button.hidden = true;
    return;
  }
  if (kind === "detail-photos") {
    detachStudio();
    $("detail-studio-host")?.replaceChildren();
    $("detail-studio").hidden = true;
    $("detail-photos").hidden = false;
    $("detail-photos-tab").classList.add("active");
    $("detail-studio-tab")?.classList.remove("active");
    return;
  }
  if (kind === "detail-studio") {
    $("detail-photos").hidden = true;
    $("detail-studio").hidden = false;
    $("detail-studio-tab").classList.add("active");
    $("detail-photos-tab").classList.remove("active");
    if (!activeStudio) mountStudio($("detail-studio-host"), ad, true);
    return;
  }
  if (kind === "detail-photo") {
    const photos = ad.gallery.length
        ? ad.gallery
        : ad.studio.photos.slice(0, 20),
      index = Number(button.dataset.index);
    if (!photos[index]) return;
    $("detail-image").src = photos[index].src;
    document
      .querySelectorAll(".detail-thumbs button")
      .forEach((element, i) => element.classList.toggle("active", i === index));
    return;
  }
}
async function boot() {
  let embedded = null,
    warning = "";
  try {
    const value = JSON.parse($("marketplace-data").textContent);
    if (value) {
      embedded = cleanState(value);
      appState = embedded;
      marketStorageKey = "copy:" + (embedded.copyId || uid());
    }
  } catch (error) {
    warning = "The saved app data could not be read: " + error.message;
  }
  try {
    database = await openDatabase();
    const saved = await storedState();
    if (saved) appState = cleanState(saved);
    storageLabel("Saved on this device");
  } catch (error) {
    if (database) database.close();
    database = null;
    storageLabel("Session only · download your ad/backup before closing");
    warning =
      warning ||
      "Browser storage is unavailable. You can test everything, then download your ad or a backup before closing.";
  }
  if (appState.startId && appState.ads.some((ad) => ad.id === appState.startId))
    view = { kind: "detail", id: appState.startId };
  else if (appState.startView === "garage") view = { kind: "garage" };
  window.addEventListener("message", studioMessage);
  document.addEventListener("click", (event) => {
    const button = event.target.closest("[data-action]");
    if (button && !button.disabled) {
      event.preventDefault();
      void action(button).catch((error) => toast(error.message));
    }
  });
  $("app").addEventListener("input", (event) => {
    if (event.target.tagName !== "SELECT") handleInput(event);
  });
  $("app").addEventListener("change", (event) => {
    if (event.target.tagName === "SELECT") handleInput(event);
    if (event.target.id === "sort-ads") {
      filters.sort = event.target.value;
      render();
    }
  });
  $("app").addEventListener("submit", (event) => {
    event.preventDefault();
    if (event.target.id === "search-form") {
      render();
      $("app")
        .querySelector(".results-top")
        ?.scrollIntoView({ block: "start" });
    }
  });
  $("gallery-files").onchange = (event) => {
    void addGallery(event.target.files).catch((error) => toast(error.message));
  };
  $("studio-import").onchange = (event) => {
    void importStudio(event.target.files[0])
      .catch((error) => toast(error.message))
      .finally(() => ($("studio-import").value = ""));
  };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && saveTimer) void saveNow();
  });
  window.addEventListener("pagehide", () => {
    if (saveTimer) void saveNow();
  });
  render();
  document.documentElement.dataset.ready = "true";
  if (warning) toast(warning);
  if (embedded) persist();
}
void boot();

})();</script>
